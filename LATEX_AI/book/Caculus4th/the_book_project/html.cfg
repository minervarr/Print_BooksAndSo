% html.cfg — make4ht. MathJax does not ship \abs; our sty defines it with
% \DeclarePairedDelimiter. # must be 'other' here: this file is absorbed into
% \Preamble, so a TeX parameter #1 would become the preamble option (xhtml).
% Allowed MathJax names: mathjax-allow.txt (python3 chapter.py test-html).
\Preamble{xhtml}
\catcode`\#=12
\Configure{MathJaxConfig}{{
  loader: {load: ['[tex]/mathtools']},
  tex: {
    tags: "ams",
    packages: {'[+]': ['mathtools']},
    macros: {
      abs: ["\\left\\lvert#1\\right\\rvert", 1],
      dom: "\\operatorname{domain}"
    }
  }
}}
\catcode`\#=6
\begin{document}
\EndPreamble
